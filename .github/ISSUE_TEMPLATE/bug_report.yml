name: Bug report
description: 报告可复现的问题（请勿提交密钥或会话内容）
body:
  - type: textarea
    id: environment
    attributes:
      label: 环境与版本
      description: OS、Node、Harness、插件版本。
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: 复现步骤
      description: 最小案例、预期行为与实际行为，日志请去敏。
    validations:
      required: true
